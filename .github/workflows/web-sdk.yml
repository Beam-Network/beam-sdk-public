name: Web SDK CI

on:
  push:
    branches: [main, dev]
    paths:
      - "packages/web-sdk/**"
      - "packages/web-sdk-server/**"
      - "examples/rooms-and-broadcast/**"
      - "package.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".github/workflows/web-sdk.yml"
  pull_request:
    paths:
      - "packages/web-sdk/**"
      - "packages/web-sdk-server/**"
      - "examples/rooms-and-broadcast/**"
      - "package.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".github/workflows/web-sdk.yml"

concurrency:
  group: web-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the declared floor; 22 is what most consumers actually run.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint:web
      - run: npm run format:check
      - run: npm run test:web
      - run: npm run build:web

      # Catches broken exports maps and ESM/CJS type mismatches, which are
      # invisible until someone installs the package and their bundler fails.
      - run: npm run package:check

      - name: Verify the script-tag bundle was produced
        run: |
          test -f packages/web-sdk/dist/beam.min.js
          # The global name is a public contract: pages that pasted the console's
          # embed snippet break if it changes.
          grep -q 'var Beam=' packages/web-sdk/dist/beam.min.js

      - name: Report bundle size
        run: |
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh packages/web-sdk/dist/beam.min.js | awk '{print $9, $5}' >> "$GITHUB_STEP_SUMMARY"
          gzip -c packages/web-sdk/dist/beam.min.js | wc -c \
            | awk '{printf "gzipped: %.1f KB\n", $1/1024}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
