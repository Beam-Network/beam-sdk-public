[package]
name = "beam-network-sdk"
version = "0.7.4"
edition = "2021"
description = "Rust SDK for BEAM transfer creation and management."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Beam-Network/beam-sdk-public"
homepage = "https://b1m.ai"
documentation = "https://docs.b1m.ai/docs/sdk"
keywords = ["beam", "transfer", "bandwidth", "storage", "sdk"]
categories = ["api-bindings", "network-programming"]

[dependencies]
async-nats = "0.38"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
hmac = "0.12"
httpdate = "1"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rmp-serde = "1"
thiserror = "2"
time = "=0.3.36"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
