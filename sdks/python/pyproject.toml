[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beam-network-sdk"
version = "0.7.5"
description = "Client SDK for the BEAM decentralized data pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Beam Network" }]
keywords = ["beam", "data-transfer", "bandwidth", "s3", "storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]

dependencies = [
    "httpx>=0.25.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    "click>=8.0.0,<9.0",
    "msgpack>=1.0.0,<2.0",
    "nats-py>=2.7.0,<3.0",
]

[project.urls]
Homepage = "https://b1m.ai"
Documentation = "https://docs.b1m.ai/docs/sdk"
Repository = "https://github.com/Beam-Network/beam-sdk-public"
Issues = "https://github.com/Beam-Network/beam-sdk/issues"
Changelog = "https://github.com/Beam-Network/beam-sdk/blob/prod/sdks/python/CHANGELOG.md"

[project.optional-dependencies]
s3 = [
    "boto3>=1.28.0,<2.0",
]
r2 = [
    "boto3>=1.28.0,<2.0",
]
gcs = [
    "google-cloud-storage>=2.16.0,<4.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10",
]
all = [
    "beam-network-sdk[s3,r2,gcs]",
]

[project.scripts]
beam-send = "beam_network_sdk.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["beam_network_sdk/cli.py"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = true
warn_unused_configs = true
